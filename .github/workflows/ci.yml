name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint, typecheck, test (Python)
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest
      - name: Build Python release artifacts
        run: uv build --offline

  swift:
    name: build and test (Swift menu-bar app)
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: clients/menubar
        run: swift build
      - name: Test
        working-directory: clients/menubar
        run: python3 ../../scripts/run_with_deadline.py 60 swift test
      - name: Build signed app bundle
        run: python3 scripts/build_app_bundle.py --output dist/AI-TTS.app
      - name: Verify app bundle
        run: codesign --verify --deep --strict dist/AI-TTS.app
