name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint, typecheck, test (Python)
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --frozen --dev
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy
      - name: Pytest
        run: uv run --frozen pytest
      - name: Build Python release artifacts
        run: uv build --offline

  swift:
    name: build and test (Swift menu-bar app)
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build
        working-directory: clients/menubar
        run: swift build
      - name: Test
        working-directory: clients/menubar
        run: python3 ../../scripts/run_with_deadline.py 60 swift test
      - name: Build signed app bundle
        run: python3 scripts/build_app_bundle.py --output dist/AI-TTS.app
      - name: Verify app bundle
        run: codesign --verify --deep --strict dist/AI-TTS.app
