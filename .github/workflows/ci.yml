name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

jobs:
  python:
    name: lint, typecheck, test (Python)
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --frozen --dev
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy
      - name: Pytest
        run: uv run --frozen pytest
      - name: Build Python release artifacts
        run: uv build --offline

  supply-chain:
    name: audit and inventory dependencies
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Install the minimum supported Python
        run: uv python install 3.12
      - name: Sync optional runtime and audit dependencies
        run: uv sync --frozen --python 3.12 --all-extras --no-dev --group supply-chain
      - name: Prepare evidence directory
        run: mkdir -p dist/supply-chain
      - name: Export the frozen all-extras graph
        run: uv export --quiet --frozen --python 3.12 --all-extras --no-dev --no-emit-project --output-file dist/supply-chain/requirements.txt
      - name: Export the CycloneDX SBOM
        run: uv export --quiet --frozen --python 3.12 --all-extras --no-dev --format cyclonedx1.5 --preview-features sbom-export --output-file dist/supply-chain/sbom.cdx.json
      - name: Audit every applicable locked dependency
        run: uv run --frozen --python 3.12 --all-extras --no-dev --group supply-chain pip-audit --strict --progress-spinner off --vulnerability-service pypi --disable-pip --require-hashes --requirement dist/supply-chain/requirements.txt --format json --output dist/supply-chain/audit.json
      - name: Inventory installed dependency licenses
        run: uv run --frozen --python 3.12 --all-extras --no-dev --group supply-chain pip-licenses --python .venv/bin/python --from mixed --format json --with-system --with-urls --output-file dist/supply-chain/licenses.raw.json
      - name: Record uv version
        run: uv --version > dist/supply-chain/uv-version.txt
      - name: Record audit-tool versions
        run: uv run --frozen --python 3.12 --all-extras --no-dev --group supply-chain pip-audit --version > dist/supply-chain/pip-audit-version.txt
      - name: Record license-tool version
        run: uv run --frozen --python 3.12 --all-extras --no-dev --group supply-chain pip-licenses --version > dist/supply-chain/pip-licenses-version.txt
      - name: Cross-check retained evidence
        run: uv run --frozen --python 3.12 --all-extras --no-dev --group supply-chain python scripts/verify_supply_chain_evidence.py --audit dist/supply-chain/audit.json --sbom dist/supply-chain/sbom.cdx.json --licenses dist/supply-chain/licenses.raw.json --lock uv.lock --output-dir dist/supply-chain
      - name: Retain supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-${{ github.sha }}
          path: dist/supply-chain/
          if-no-files-found: error
          retention-days: 14

  swift:
    name: build and test (Swift menu-bar app)
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select the Xcode this project is built against
        # The runner's default is older than the Xcode this was developed
        # against and cannot extract App Intents metadata, so a bundle built
        # on the default would ship without Shortcuts integration. Pinned to
        # one version for the same reason the actions are pinned to commit
        # SHAs: a toolchain that drifts changes the artifact.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build
        working-directory: clients/menubar
        run: swift build
      - name: Test
        working-directory: clients/menubar
        run: python3 ../../scripts/run_with_deadline.py 60 swift test
      - name: Build signed app bundle
        run: python3 scripts/build_app_bundle.py --output dist/AI-TTS.app
      - name: Verify app bundle
        run: codesign --verify --deep --strict dist/AI-TTS.app

  # A tagged commit produces the artifacts a person installs, built from the
  # commit the tag names and only after every other job has passed. They are
  # retained on the workflow run rather than attached to a GitHub Release:
  # attaching needs contents: write, and this workflow's whole trust boundary
  # is that nothing in it can write to the repository. Creating the release
  # from these verified artifacts stays a human action.
  release:
    name: build release artifacts (tagged commits)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, supply-chain, swift]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --frozen --dev
      - name: Check the tag matches the packaged version
        run: uv run --frozen python scripts/check_release_tag.py "${GITHUB_REF_NAME}"
      - name: Build the Python distributions
        run: uv build --offline --out-dir dist/release
      - name: Select the Xcode this project is built against
        # The runner's default is older than the Xcode this was developed
        # against and cannot extract App Intents metadata, so a bundle built
        # on the default would ship without Shortcuts integration. Pinned to
        # one version for the same reason the actions are pinned to commit
        # SHAs: a toolchain that drifts changes the artifact.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build the signed app bundle
        run: python3 scripts/build_app_bundle.py --output dist/release/AI-TTS.app
      - name: Verify the app bundle
        run: codesign --verify --deep --strict dist/release/AI-TTS.app
      - name: Archive the app bundle
        working-directory: dist/release
        run: ditto -c -k --keepParent AI-TTS.app AI-TTS.app.zip
      - name: Retain the release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/AI-TTS.app.zip
          if-no-files-found: error
          retention-days: 90
