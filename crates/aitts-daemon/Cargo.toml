[package]
name = "aitts-daemon"
description = "The ai-ttsd Rust daemon: process lifetime, the Unix socket server, and read operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "ai-ttsd"
path = "src/main.rs"

[dependencies]
aitts-artifacts = { path = "../aitts-artifacts" }
aitts-domain = { path = "../aitts-domain" }
aitts-engine = { path = "../aitts-engine" }
aitts-protocol = { path = "../aitts-protocol" }
aitts-store = { path = "../aitts-store" }
serde_json = "1"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
