[package]
name = "aitts-cli"
description = "The ai-tts command-line client for the AI-TTS daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "ai-tts"
path = "src/main.rs"

[dependencies]
aitts-client = { path = "../aitts-client" }
aitts-protocol = { path = "../aitts-protocol" }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aitts-daemon = { path = "../aitts-daemon" }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
