[package]
name = "aitts-artifacts"
description = "AI-TTS generated audio files and their owner-only directories, in the Python daemon's layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
libc = "0.2"
serde = "1"
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
