[workspace]
members = ["crates/aitts-client", "crates/aitts-daemon", "crates/aitts-domain", "crates/aitts-engine", "crates/aitts-protocol", "crates/aitts-store"]
exclude = ["vendor/markdown"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/flyingrobots/AI-TTS"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "deny"
str_to_string = "deny"
