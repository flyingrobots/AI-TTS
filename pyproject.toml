[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-tts"
version = "0.1.0"
description = "Local speech daemon for macOS: agents submit text, one voice speaks at a time."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "James Ross" }]
dependencies = [
    "blake3>=1,<2",
    "markdown-it-py>=4.2,<5",
    "mcp>=2,<3",
    "numpy>=1.26",
    "pydantic>=2.11,<3",
    "sounddevice>=0.5",
    "soundfile>=0.13",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4"]
mlx = [
    "kokoro-mlx==0.1.2; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version < '3.13'",
    "mlx>=0.31.1; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version < '3.13'",
]

chatterbox = [
    "chatterbox-tts @ https://github.com/resemble-ai/chatterbox/archive/cb240457c3e197c6fbc2e7d3b9765febe63f7e73.tar.gz",
    "resemble-perth @ https://github.com/resemble-ai/Perth/archive/ff1c8ac55a976971245cdd53c18d6131ca00d993.tar.gz",
    "torch>=2.13",
    "torchaudio>=2.11",
]
tui = [
    "textual>=0.70.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
ai-tts = "aitts.cli:main"
ai-tts-mcp = "aitts.adapters.mcp:main"

[dependency-groups]
dev = [
    "hypothesis>=6.138",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "textual>=0.70.0",
    # Exercise the optional model-download HTTP stack in security regressions.
    "urllib3>=2.8.0,<3",
]
supply-chain = [
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aitts"]

[tool.hatch.build.targets.sdist.force-include]
"assets" = "assets"

[tool.hatch.build.targets.wheel.force-include]
"assets" = "aitts/assets"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Mutually exclusive with D211 / D212 (one of each pair must be chosen).
    "D203",
    "D213",
    # Conflict with the ruff formatter.
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # pytest uses bare asserts
    "D",        # test names are the documentation
    "PLR2004",  # literal expectations are the point of a test
    "SLF001",   # tests may reach into internals
    "ANN401",   # fixtures may be Any-typed where pytest requires it
    "ASYNC109", # test helpers take explicit timeouts by design
    "ASYNC240", # trivial Path calls in tests do not block meaningfully
    "TC001",    # runtime imports keep test tracebacks readable
    "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
warn_unreachable = true
warn_return_any = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Third-party modules that ship no type information. Every one of these is
# imported lazily inside a function so the dependency stays off import time,
# and huggingface_hub is not even a declared dependency — it arrives
# transitively through the kokoro extra. CI type-checks with dev dependencies
# only, so a module absent from this list fails there while resolving fine in
# a developer's --all-extras environment. tests/test_optional_imports.py pins
# the list against the source rather than trusting it to stay complete.
[[tool.mypy.overrides]]
module = ["torch", "sounddevice", "soundfile", "kokoro", "kokoro.*", "kokoro_mlx", "mlx", "mlx.*", "huggingface_hub", "chatterbox", "chatterbox.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --timeout=30"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "small: single-process hermetic test with no sockets, filesystem, threads, or sleeps",
    "medium: single-machine hermetic test that may use owned filesystem, loopback/Unix sockets, or threads",
    "large: test that crosses a machine boundary or depends on an external service",
    "oracle(source): authority from which the expected behavior is derived",
]
