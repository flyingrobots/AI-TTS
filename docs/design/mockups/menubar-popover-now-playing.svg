<svg xmlns="http://www.w3.org/2000/svg" width="368" height="500" viewBox="0 0 368 500" role="img" aria-labelledby="ttl desc">
  <title id="ttl">AI-TTS menu bar popover — Now Playing</title>
  <desc id="desc">A 360 by 480 macOS popover anchored to the menu bar. Header with app name and playback status, a four-way segmented control, the current utterance with spoken text dimmed, a scrubber, transport controls, and a peek at the next two queued utterances.</desc>
  <style>
    svg{
      --panel:#FFFFFF;--sunken:#F4F4F7;--chip:#ECECF0;--seg:#E9E9ED;--segsel:#FFFFFF;
      --sep:#E0E0E5;--edge:#D6D6DB;--hover:#F3F3F6;--track:#E3E3E9;
      --fg:#16161A;--fg2:#6B6B73;--fg3:#9C9CA4;
      --accent:#0A6CFF;--tint:#E7F0FF;--onaccent:#FFFFFF;
      --ok:#1B8F45;--oktint:#E2F3E8;--warn:#B87400;--warntint:#FBEFD9;--err:#CC3325;--errtint:#FAE6E4;
    }
    @media (prefers-color-scheme:dark){svg{
      --panel:#2C2C30;--sunken:#242428;--chip:#3A3A40;--seg:#212124;--segsel:#4A4A51;
      --sep:#3C3C42;--edge:#1B1B1E;--hover:#35353B;--track:#3E3E45;
      --fg:#F2F2F5;--fg2:#A2A2AA;--fg3:#75757E;
      --accent:#4F9DFF;--tint:#20344F;--onaccent:#FFFFFF;
      --ok:#45C46E;--oktint:#1C3A29;--warn:#DFA232;--warntint:#3A2E15;--err:#FF6E60;--errtint:#3F211E;
    }}
    .panel{fill:var(--panel)}.sunken{fill:var(--sunken)}.chip{fill:var(--chip)}
    .seg{fill:var(--seg)}.segsel{fill:var(--segsel)}.sep{fill:var(--sep)}
    .hover{fill:var(--hover)}.track{fill:var(--track)}
    .acc{fill:var(--accent)}.tint{fill:var(--tint)}.onacc{fill:var(--onaccent)}
    .ok{fill:var(--ok)}.oktint{fill:var(--oktint)}.warn{fill:var(--warn)}.warntint{fill:var(--warntint)}
    .err{fill:var(--err)}.errtint{fill:var(--errtint)}
    .t{fill:var(--fg)}.t2{fill:var(--fg2)}.t3{fill:var(--fg3)}
    .eo{stroke:var(--edge)}.so2{stroke:var(--fg2)}.so3{stroke:var(--fg3)}
    .soacc{stroke:var(--accent)}.sopanel{stroke:var(--panel)}
    .nf{fill:none}
  </style>
  <g font-family="-apple-system, system-ui, sans-serif">

    <!-- popover arrow + panel -->
    <rect class="panel eo" fill="#FFFFFF" stroke="#D6D6DB" x="4.5" y="14.5" width="359" height="479" rx="12"/>
    <path class="panel" fill="#FFFFFF" d="M169 15.6 L180 4.2 L191 15.6 Z"/>
    <path class="eo nf" fill="none" stroke="#D6D6DB" stroke-linecap="round" d="M170 14.5 L180 4.4 L190 14.5"/>

    <!-- header -->
    <text class="t" fill="#16161A" x="20" y="40" font-size="13.5" font-weight="600">AI-TTS</text>
    <circle class="acc" fill="#0A6CFF" cx="76" cy="35.5" r="3.5"/>
    <text class="t2" fill="#6B6B73" x="85" y="39.5" font-size="11">Speaking</text>
    <g transform="translate(338,35)" stroke-width="2.2">
      <circle class="so2 nf" stroke="#6B6B73" fill="none" stroke-width="1.7" r="4"/>
      <g class="so2 nf" stroke="#6B6B73" fill="none">
        <path d="M0 -7.9V-5.5"/><path d="M0 5.5V7.9"/><path d="M-7.9 0H-5.5"/><path d="M5.5 0H7.9"/>
        <path d="M-5.6 -5.6L-3.9 -3.9"/><path d="M3.9 3.9L5.6 5.6"/><path d="M5.6 -5.6L3.9 -3.9"/><path d="M-3.9 3.9L-5.6 5.6"/>
      </g>
    </g>

    <!-- segmented control -->
    <rect class="seg" fill="#E9E9ED" x="20" y="64" width="328" height="28" rx="8"/>
    <rect class="segsel eo" fill="#FFFFFF" stroke="#D6D6DB" x="22.5" y="66.5" width="77" height="23" rx="6"/>
    <text class="t" fill="#16161A" x="61" y="82" font-size="11" font-weight="600" text-anchor="middle">Now Playing</text>
    <text class="t2" fill="#6B6B73" x="143" y="82" font-size="11" text-anchor="middle">Up Next</text>
    <text class="t2" fill="#6B6B73" x="225" y="82" font-size="11" text-anchor="middle">Synthesis</text>
    <text class="t2" fill="#6B6B73" x="307" y="82" font-size="11" text-anchor="middle">History</text>

    <!-- source line -->
    <rect class="chip" fill="#ECECF0" x="20" y="105" width="76" height="18" rx="6"/>
    <text class="t2" fill="#6B6B73" x="58" y="117.5" font-size="10" text-anchor="middle">claude-code</text>
    <text class="t3" fill="#9C9CA4" x="104" y="117.5" font-size="10.5">queued 2:40 PM</text>
    <text class="t3" fill="#9C9CA4" x="348" y="117.5" font-size="10.5" text-anchor="end">#1042</text>

    <!-- utterance, spoken text dimmed -->
    <text x="20" y="150" font-size="13.5" xml:space="preserve" class="t3" fill="#9C9CA4">All 41 tests pass. The cache-eviction</text>
    <text x="20" y="169" font-size="13.5" xml:space="preserve"><tspan class="t3" fill="#9C9CA4">regression was a stale index entry, </tspan><tspan class="t" fill="#16161A">not</tspan></text>
    <text x="20" y="188" font-size="13.5" xml:space="preserve" class="t" fill="#16161A">the parser. I reverted the config bump</text>
    <text x="20" y="207" font-size="13.5" xml:space="preserve" class="t" fill="#16161A">and re-ran the suite — clean exit.</text>

    <!-- scrubber -->
    <rect class="track" fill="#E3E3E9" x="20" y="228" width="328" height="4" rx="2"/>
    <rect class="acc" fill="#0A6CFF" x="20" y="228" width="126" height="4" rx="2"/>
    <circle class="acc sopanel" fill="#0A6CFF" stroke="#FFFFFF" stroke-width="2" cx="146" cy="230" r="5.5"/>
    <text class="t2" fill="#6B6B73" x="20" y="251" font-size="10.5">0:11</text>
    <text class="t2" fill="#6B6B73" x="348" y="251" font-size="10.5" text-anchor="end">0:29</text>

    <!-- transport -->
    <rect class="chip" fill="#ECECF0" x="20" y="283" width="46" height="22" rx="7"/>
    <text class="t" fill="#16161A" x="43" y="298" font-size="11" text-anchor="middle">1.0×</text>

    <g class="t" fill="#16161A">
      <rect x="118" y="286" width="3" height="16" rx="1.5"/>
      <path d="M122.5 294 L133 286 L133 302 Z"/>
    </g>

    <circle class="acc" fill="#0A6CFF" cx="184" cy="294" r="23"/>
    <g class="onacc" fill="#FFFFFF">
      <rect x="177.2" y="285" width="4.6" height="18" rx="1.6"/>
      <rect x="186.2" y="285" width="4.6" height="18" rx="1.6"/>
    </g>

    <g class="t" fill="#16161A">
      <path d="M245.5 294 L235 286 L235 302 Z"/>
      <rect x="247" y="286" width="3" height="16" rx="1.5"/>
    </g>

    <g transform="translate(328,294)">
      <path class="t" fill="#16161A" d="M0 -3.4 H3.2 L8.6 -8 V8 L3.2 3.4 H0 Z"/>
      <path class="so2 nf" stroke="#6B6B73" fill="none" stroke-width="1.4" stroke-linecap="round" d="M12 -4.2 a5.2 5.2 0 0 1 0 8.4"/>
      <path class="so2 nf" stroke="#6B6B73" fill="none" stroke-width="1.4" stroke-linecap="round" d="M15.4 -7.6 a9 9 0 0 1 0 15.2"/>
    </g>

    <rect class="sep" fill="#E0E0E5" x="20" y="336" width="328" height="1"/>

    <!-- up next peek -->
    <text class="t3" fill="#9C9CA4" x="20" y="359" font-size="10" font-weight="600" letter-spacing="0.7">UP NEXT</text>
    <text class="t3" fill="#9C9CA4" x="348" y="359" font-size="10" text-anchor="end">3 queued · 1m 12s</text>

    <circle class="ok" fill="#1B8F45" cx="26" cy="386" r="3.5"/>
    <text class="t" fill="#16161A" x="40" y="390" font-size="12">Dependency audit finished: no advisori…</text>
    <text class="t2" fill="#6B6B73" x="348" y="390" font-size="10.5" text-anchor="end">0:22</text>
    <rect class="sep" fill="#E0E0E5" x="40" y="406" width="308" height="1"/>

    <circle class="ok" fill="#1B8F45" cx="26" cy="424" r="3.5"/>
    <text class="t" fill="#16161A" x="40" y="428" font-size="12">Reminder: the design review starts in t…</text>
    <text class="t2" fill="#6B6B73" x="348" y="428" font-size="10.5" text-anchor="end">0:09</text>
    <rect class="sep" fill="#E0E0E5" x="20" y="444" width="328" height="1"/>

    <text class="acc" fill="#0A6CFF" x="20" y="467" font-size="11.5">Show all in Up Next  →</text>
    <text class="t3" fill="#9C9CA4" x="348" y="467" font-size="10.5" text-anchor="end">⌥-click a row to play it now</text>
  </g>
</svg>
