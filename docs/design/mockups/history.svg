<svg xmlns="http://www.w3.org/2000/svg" width="368" height="500" viewBox="0 0 368 500" role="img" aria-labelledby="ttl desc">
  <title id="ttl">AI-TTS menu bar popover — History</title>
  <desc id="desc">A searchable log of everything spoken, grouped by day. Each row shows the time it was spoken, the text, duration and voice, and a replay button. The first entry is long and truncated with an ellipsis. A persistent mini transport is docked at the bottom.</desc>
  <style>
    svg{
      --panel:#FFFFFF;--sunken:#F4F4F7;--chip:#ECECF0;--seg:#E9E9ED;--segsel:#FFFFFF;
      --sep:#E0E0E5;--edge:#D6D6DB;--hover:#F3F3F6;--track:#E3E3E9;
      --fg:#16161A;--fg2:#6B6B73;--fg3:#9C9CA4;
      --accent:#0A6CFF;--tint:#E7F0FF;--onaccent:#FFFFFF;
      --ok:#1B8F45;--oktint:#E2F3E8;--warn:#B87400;--warntint:#FBEFD9;--err:#CC3325;--errtint:#FAE6E4;
    }
    @media (prefers-color-scheme:dark){svg{
      --panel:#2C2C30;--sunken:#242428;--chip:#3A3A40;--seg:#212124;--segsel:#4A4A51;
      --sep:#3C3C42;--edge:#1B1B1E;--hover:#35353B;--track:#3E3E45;
      --fg:#F2F2F5;--fg2:#A2A2AA;--fg3:#75757E;
      --accent:#4F9DFF;--tint:#20344F;--onaccent:#FFFFFF;
      --ok:#45C46E;--oktint:#1C3A29;--warn:#DFA232;--warntint:#3A2E15;--err:#FF6E60;--errtint:#3F211E;
    }}
    .panel{fill:var(--panel)}.sunken{fill:var(--sunken)}.chip{fill:var(--chip)}
    .seg{fill:var(--seg)}.segsel{fill:var(--segsel)}.sep{fill:var(--sep)}
    .hover{fill:var(--hover)}.track{fill:var(--track)}
    .acc{fill:var(--accent)}.tint{fill:var(--tint)}.onacc{fill:var(--onaccent)}
    .ok{fill:var(--ok)}.oktint{fill:var(--oktint)}.warn{fill:var(--warn)}.warntint{fill:var(--warntint)}
    .err{fill:var(--err)}.errtint{fill:var(--errtint)}
    .t{fill:var(--fg)}.t2{fill:var(--fg2)}.t3{fill:var(--fg3)}
    .eo{stroke:var(--edge)}.so2{stroke:var(--fg2)}.so3{stroke:var(--fg3)}
    .soacc{stroke:var(--accent)}.sopanel{stroke:var(--panel)}
    .nf{fill:none}
  </style>
  <g font-family="-apple-system, system-ui, sans-serif">

    <rect class="panel eo" fill="#FFFFFF" stroke="#D6D6DB" x="4.5" y="14.5" width="359" height="479" rx="12"/>
    <path class="panel" fill="#FFFFFF" d="M169 15.6 L180 4.2 L191 15.6 Z"/>
    <path class="eo nf" fill="none" stroke="#D6D6DB" stroke-linecap="round" d="M170 14.5 L180 4.4 L190 14.5"/>

    <text class="t" fill="#16161A" x="20" y="40" font-size="13.5" font-weight="600">AI-TTS</text>
    <circle class="acc" fill="#0A6CFF" cx="76" cy="35.5" r="3.5"/>
    <text class="t2" fill="#6B6B73" x="85" y="39.5" font-size="11">Speaking</text>
    <g transform="translate(338,35)" stroke-width="2.2">
      <circle class="so2 nf" stroke="#6B6B73" fill="none" stroke-width="1.7" r="4"/>
