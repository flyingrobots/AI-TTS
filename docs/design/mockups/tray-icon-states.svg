<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="412" viewBox="0 0 720 412" role="img" aria-labelledby="ttl desc">
  <title id="ttl">AI-TTS menu bar icon — states</title>
  <desc id="desc">Five states of the 18 by 18 point template icon: idle as an outlined speech bubble, synthesizing as a filled bubble with three dots, playing as a filled bubble with waveform bars, paused as a filled bubble with two pause bars, and error as a filled bubble with an exclamation mark. Each is shown at four times size and at actual size in a light and a dark menu bar.</desc>
  <style>
    svg{
      --panel:#FFFFFF;--sunken:#F4F4F7;--chip:#ECECF0;--sep:#E0E0E5;--edge:#D6D6DB;
      --fg:#16161A;--fg2:#6B6B73;--fg3:#9C9CA4;--accent:#0A6CFF;
    }
    @media (prefers-color-scheme:dark){svg{
      --panel:#1D1D20;--sunken:#242428;--chip:#3A3A40;--sep:#3C3C42;--edge:#3C3C42;
      --fg:#F2F2F5;--fg2:#A2A2AA;--fg3:#75757E;--accent:#4F9DFF;
    }}
    .panel{fill:var(--panel)}.sunken{fill:var(--sunken)}.sep{fill:var(--sep)}.sepline{stroke:var(--sep);fill:none}
    .t{fill:var(--fg)}.t2{fill:var(--fg2)}.t3{fill:var(--fg3)}
    .ink{fill:var(--fg)}.inkline{stroke:var(--fg);fill:none}
  </style>
  <defs>
    <path id="ic-idle" d="M4.6 2.6 H13.4 A3 3 0 0 1 16.4 5.6 V10.4 A3 3 0 0 1 13.4 13.4 H8.8 L5 16.4 L6.1 13.4 H4.6 A3 3 0 0 1 1.6 10.4 V5.6 A3 3 0 0 1 4.6 2.6 Z"/>
    <path id="ic-synth" fill-rule="evenodd" d="M4.6 2.6 H13.4 A3 3 0 0 1 16.4 5.6 V10.4 A3 3 0 0 1 13.4 13.4 H8.8 L5 16.4 L6.1 13.4 H4.6 A3 3 0 0 1 1.6 10.4 V5.6 A3 3 0 0 1 4.6 2.6 Z M5.35 8.3 a0.95 0.95 0 1 0 1.9 0 a0.95 0.95 0 1 0 -1.9 0 Z M8.05 8.3 a0.95 0.95 0 1 0 1.9 0 a0.95 0.95 0 1 0 -1.9 0 Z M10.75 8.3 a0.95 0.95 0 1 0 1.9 0 a0.95 0.95 0 1 0 -1.9 0 Z"/>
    <path id="ic-play" fill-rule="evenodd" d="M4.6 2.6 H13.4 A3 3 0 0 1 16.4 5.6 V10.4 A3 3 0 0 1 13.4 13.4 H8.8 L5 16.4 L6.1 13.4 H4.6 A3 3 0 0 1 1.6 10.4 V5.6 A3 3 0 0 1 4.6 2.6 Z M5 6.6 h1.4 v2.8 h-1.4 z M7.1 5.2 h1.4 v5.6 h-1.4 z M9.2 6 h1.4 v4 h-1.4 z M11.3 5 h1.4 v6 h-1.4 z"/>
    <path id="ic-pause" fill-rule="evenodd" d="M4.6 2.6 H13.4 A3 3 0 0 1 16.4 5.6 V10.4 A3 3 0 0 1 13.4 13.4 H8.8 L5 16.4 L6.1 13.4 H4.6 A3 3 0 0 1 1.6 10.4 V5.6 A3 3 0 0 1 4.6 2.6 Z M6.8 5.3 h1.7 v5.4 h-1.7 z M9.5 5.3 h1.7 v5.4 h-1.7 z"/>
    <path id="ic-error" fill-rule="evenodd" d="M4.6 2.6 H13.4 A3 3 0 0 1 16.4 5.6 V10.4 A3 3 0 0 1 13.4 13.4 H8.8 L5 16.4 L6.1 13.4 H4.6 A3 3 0 0 1 1.6 10.4 V5.6 A3 3 0 0 1 4.6 2.6 Z M8.3 5 h1.4 v4.2 h-1.4 z M8.3 10 h1.4 v1.5 h-1.4 z"/>
  </defs>

  <rect class="panel" fill="#FFFFFF" x="0" y="0" width="720" height="412"/>

  <g font-family="-apple-system, system-ui, sans-serif">
    <text class="t" fill="#16161A" x="40" y="44" font-size="16" font-weight="600">Menu bar icon — states</text>
    <text class="t3" fill="#9C9CA4" x="40" y="64" font-size="11.5">18 × 18 pt template image — one colour plus alpha, tinted by macOS to match the bar.</text>

    <!-- 4x -->
    <g transform="translate(68,88) scale(4)"><use class="inkline" xlink:href="#ic-idle" href="#ic-idle" stroke="#16161A" fill="none" stroke-width="1.5" stroke-linejoin="round"/></g>
    <g transform="translate(196,88) scale(4)"><use class="ink" xlink:href="#ic-synth" href="#ic-synth" fill="#16161A"/></g>
    <g transform="translate(324,88) scale(4)"><use class="ink" xlink:href="#ic-play" href="#ic-play" fill="#16161A"/></g>
    <g transform="translate(452,88) scale(4)"><use class="ink" xlink:href="#ic-pause" href="#ic-pause" fill="#16161A"/></g>
    <g transform="translate(580,88) scale(4)"><use class="ink" xlink:href="#ic-error" href="#ic-error" fill="#16161A"/></g>

    <text class="t" fill="#16161A" x="104" y="188" font-size="12.5" font-weight="600" text-anchor="middle">Idle</text>
    <text class="t" fill="#16161A" x="232" y="188" font-size="12.5" font-weight="600" text-anchor="middle">Synthesizing</text>
    <text class="t" fill="#16161A" x="360" y="188" font-size="12.5" font-weight="600" text-anchor="middle">Playing</text>
    <text class="t" fill="#16161A" x="488" y="188" font-size="12.5" font-weight="600" text-anchor="middle">Paused</text>
    <text class="t" fill="#16161A" x="616" y="188" font-size="12.5" font-weight="600" text-anchor="middle">Error</text>

    <text class="t3" fill="#9C9CA4" x="104" y="205" font-size="10.5" text-anchor="middle">Both queues empty,</text>
    <text class="t3" fill="#9C9CA4" x="104" y="219" font-size="10.5" text-anchor="middle">nothing playing</text>
    <text class="t3" fill="#9C9CA4" x="232" y="205" font-size="10.5" text-anchor="middle">Generating audio,</text>
    <text class="t3" fill="#9C9CA4" x="232" y="219" font-size="10.5" text-anchor="middle">nothing audible yet</text>
    <text class="t3" fill="#9C9CA4" x="360" y="205" font-size="10.5" text-anchor="middle">Audio is coming out</text>
    <text class="t3" fill="#9C9CA4" x="360" y="219" font-size="10.5" text-anchor="middle">of the speakers now</text>
    <text class="t3" fill="#9C9CA4" x="488" y="205" font-size="10.5" text-anchor="middle">Held by you; the</text>
    <text class="t3" fill="#9C9CA4" x="488" y="219" font-size="10.5" text-anchor="middle">queue is intact</text>
    <text class="t3" fill="#9C9CA4" x="616" y="205" font-size="10.5" text-anchor="middle">Synthesis or output</text>
    <text class="t3" fill="#9C9CA4" x="616" y="219" font-size="10.5" text-anchor="middle">failed; needs you</text>

    <!-- light menu bar, 1x -->
    <text class="t3" fill="#9C9CA4" x="40" y="252" font-size="10" font-weight="600" letter-spacing="0.7">LIGHT MENU BAR · ACTUAL SIZE</text>
    <rect x="40" y="258" width="640" height="30" rx="6" fill="#EDEDEF"/>
    <rect x="40" y="258" width="640" height="30" rx="6" fill="none" stroke="#DCDCDE"/>
    <g fill="#26262A">
      <g transform="translate(95,264)"><use xlink:href="#ic-idle" href="#ic-idle" fill="none" stroke="#26262A" stroke-width="1.5" stroke-linejoin="round"/></g>
      <g transform="translate(223,264)"><use xlink:href="#ic-synth" href="#ic-synth"/></g>
      <g transform="translate(351,264)"><use xlink:href="#ic-play" href="#ic-play"/></g>
      <g transform="translate(479,264)"><use xlink:href="#ic-pause" href="#ic-pause"/></g>
      <g transform="translate(607,264)"><use xlink:href="#ic-error" href="#ic-error"/></g>
    </g>

    <!-- dark menu bar, 1x -->
    <text class="t3" fill="#9C9CA4" x="40" y="312" font-size="10" font-weight="600" letter-spacing="0.7">DARK MENU BAR · ACTUAL SIZE</text>
    <rect x="40" y="318" width="640" height="30" rx="6" fill="#222225"/>
    <rect class="sepline" x="40" y="318" width="640" height="30" rx="6" fill="none" stroke="#E0E0E5"/>
    <g fill="#F2F2F5">
      <g transform="translate(95,324)"><use xlink:href="#ic-idle" href="#ic-idle" fill="none" stroke="#F2F2F5" stroke-width="1.5" stroke-linejoin="round"/></g>
      <g transform="translate(223,324)"><use xlink:href="#ic-synth" href="#ic-synth"/></g>
      <g transform="translate(351,324)"><use xlink:href="#ic-play" href="#ic-play"/></g>
      <g transform="translate(479,324)"><use xlink:href="#ic-pause" href="#ic-pause"/></g>
      <g transform="translate(607,324)"><use xlink:href="#ic-error" href="#ic-error"/></g>
    </g>

    <rect class="sep" fill="#E0E0E5" x="40" y="366" width="640" height="1"/>
    <text class="t3" fill="#9C9CA4" x="40" y="386" font-size="10.5">One container, five marks. Idle is the only outlined state, so weight alone answers “is it doing anything” before you read the glyph.</text>
    <text class="t3" fill="#9C9CA4" x="40" y="402" font-size="10.5">Only synthesizing and playing animate, so motion in the menu bar always means work in flight.</text>
  </g>
</svg>
